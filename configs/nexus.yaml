data_root: /gammascratch/amodak/SensAug/data
mmconfig_path: /gammascratch/amodak/SensAug/sensaug/custom_configs/mmseg
primary_metric: mIoU

# The two pipelines' ITERATION intervals; null takes the default. CLI flags
# (--round_interval, --corr-interval) override these.
#
# The ROUND GRID is not here -- it lives in configs/rounds.yaml, which is
# cluster-independent on purpose (how many val rounds a run has, and which of them
# the correlation pipeline measures R on, is an experiment parameter, not a path).
schedule:
  # The SA pipeline's clock: iters between val/SA rounds (RobustValLoop).
  # null -> max_iters // n_rounds, with n_rounds from configs/rounds.yaml (20).
  # The SA *curve* itself is recomputed every 6th round, so the effective SA
  # cadence is 6x this.
  round_interval: null
  # Set a number here only to put the correlation pipeline on a FIXED clock of its
  # own. null -- the default -- means it instead fires on the rounds named by
  # configs/rounds.yaml (3, 4, 10, 16 of 20), which are the rounds a pdf can
  # actually read the resulting R on.
  corr_interval: null

# Op names to always exclude from sampling, for the whole run, regardless of
# --aug-type. Empty by default. See sensaug/dataset/augmentations.py for valid
# names (LEGACY20_OPS' 20 PascalCase names, or the 32 shared snake_case names
# in DIFF32_OPS/NON_DIFF32_OPS). train.py validates every name at startup and
# refuses to run on an unrecognized one. CLI flag --pruned-augmentations
# overrides this list rather than merging with it.
pruned_augmentations: []

datasets:
  cityscapes: cityscapes
  ade20k: ade/ADEChallengeData2016
  pascal_voc12: VOCdevkit/VOC2012
  loveda: loveDA
  potsdam: potsdam
  synapse: synapse
  a2i2haze: a2i2haze
  acdc: acdc
  idd: idd
supported_backbones:
  - pspnet
  - segformer
  - convnext
  - deeplabv3plus
  - swin
  - mae
  - vit
